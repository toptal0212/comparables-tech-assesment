name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app/ tests/ scripts/

      - name: Types
        run: mypy app/
        # Advisory. The suite is the correctness gate; a type-checker
        # disagreement should not block a release on its own.
        continue-on-error: true

      - name: Tests
        # The suite runs offline with embeddings disabled, so no model download
        # and no network. HF_HUB_OFFLINE makes an accidental fetch fail loudly
        # rather than silently slowing CI.
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest -q

  docker:
    name: Build image
    runs-on: ubuntu-latest
    # Only after the suite passes: this build embeds 50k documents and takes
    # several minutes, so there is no point starting it on a red commit.
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: company-search:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 company-search:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null 2>&1; then
              echo "ready after ${i}s"; break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8000/health/ready | tee /tmp/ready.json
          python - <<'PY'
          import json
          state = json.load(open("/tmp/ready.json"))["index"]
          assert state["ready"] is True, state
          assert state["documents"] == 50000, state
          # The image ships a prebuilt matrix; if this is false the build silently
          # produced a lexical-only deployment.
          assert state["semantic_search"] is True, state
          assert state["semantic_coverage"] == 1.0, state
          print("index verified:", state)
          PY

          # A real query, end to end, against the built image.
          curl -fsS -X POST http://127.0.0.1:8000/search \
            -H 'content-type: application/json' \
            -d '{"query":"Find fintech companies in Finland working on fraud detection","limit":3}' \
            | tee /tmp/search.json
          python - <<'PY'
          import json
          body = json.load(open("/tmp/search.json"))
          assert body["results"], body
          assert body["parsed"]["locations"] == ["Finland"], body["parsed"]
          assert all(c["location"] == "Finland" for c in body["results"])
          print("search verified:", body["total"], "matches in", body["took_ms"], "ms")
          PY

      - name: Container logs on failure
        if: failure()
        run: docker logs api || true

      - name: Clean up
        if: always()
        run: docker rm -f api || true
