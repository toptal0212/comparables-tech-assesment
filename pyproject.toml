[project]
name = "company-search"
version = "1.0.0"
description = "Natural-language target company search over ~50k companies"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = [
    "B008",   # FastAPI's Depends()/Query() defaults are call-in-default by design.
    "SIM905", # Would rewrite readable multi-line word lists as one 800-char list
              # literal. The vocabularies in nlq/parser.py are meant to be read.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]
